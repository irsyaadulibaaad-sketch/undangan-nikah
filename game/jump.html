<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Wedding Jump Sky</title>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #FDFCF9; touch-action: none; }
  canvas { display: block; width: 100%; height: 100%; }
  #hint {
    position: fixed; top: 10px; left: 0; right: 0; text-align: center;
    font-family: 'Montserrat', sans-serif; font-size: 11px; color: #9E7A3E;
    font-weight: 600; letter-spacing: 2px; pointer-events: none;
    text-transform: uppercase; opacity: 0.8;
  }
</style>
</head>
<body>
<div id="hint">Geser Kiri/Kanan untuk Melompat</div>
<canvas id="gameCanvas"></canvas>
<script>
  const canvas = document.getElementById("gameCanvas");
  const ctx = canvas.getContext("2d");
  let W, H;

  // Skala untuk menyesuaikan layar HP
  function resize() {
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W;
    canvas.height = H;
  }
  window.addEventListener("resize", resize);
  resize();

  // Konstanta Game
  const GRAVITY = 0.4;
  const JUMP_FORCE = -11;
  const MOVE_SPEED = 6;
  
  // Warna Tema
  const COL = {
    prince: "#1A231B", gold: "#C5A059", skin: "#F4E3C8", dress: "#FFFFFF", hair: "#3B2F26"
  };

  let player = {
    x: W / 2,
    y: H - 150,
    vx: 0,
    vy: 0,
    w: 60,
    h: 70,
    facing: 1,
    isJumping: false
  };

  let platforms = [];
  let score = 0;
  let cameraY = 0;
  let gameOver = false;
  let highScore = parseInt(localStorage.getItem("jumpHi") || 0);
  let particles = [];

  // Input Controls
  let moveLeft = false;
  let moveRight = false;

  // Deteksi sentuhan layar (kiri/kanan)
  function handleTouch(e) {
    e.preventDefault();
    if (e.touches.length > 0) {
      const touchX = e.touches[0].clientX;
      moveLeft = touchX < W / 2;
      moveRight = touchX >= W / 2;
    }
  }
  function handleTouchEnd(e) {
    e.preventDefault();
    moveLeft = false;
    moveRight = false;
  }
  
  // Deteksi keyboard untuk PC/Laptop
  function handleKey(e) {
    if (e.key === "ArrowLeft" || e.key === "a") moveLeft = e.type === "keydown";
    if (e.key === "ArrowRight" || e.key === "d") moveRight = e.type === "keydown";
  }

  canvas.addEventListener("touchstart", handleTouch, { passive: false });
  canvas.addEventListener("touchmove", handleTouch, { passive: false });
  canvas.addEventListener("touchend", handleTouchEnd, { passive: false });
  window.addEventListener("keydown", handleKey);
  window.addEventListener("keyup", handleKey);

  // Inisialisasi Platform Pertama
  function initGame() {
    platforms = [{ x: 0, y: H - 80, w: W, h: 80, type: "ground" }];
    player.x = W / 2;
    player.y = H - 150;
    player.vy = JUMP_FORCE;
    player.isJumping = true;
    score = 0;
    cameraY = 0;
    gameOver = false;
    particles = [];
    
    // Generate platform awal ke atas
    for (let i = 1; i <= 10; i++) {
      createPlatform(H - 80 - i * 100);
    }
  }

  function createPlatform(y) {
    const w = Math.random() * 60 + 50; // Lebar 50 - 110
    const x = Math.random() * (W - w);
    // 15% peluang platform bergerak (opsional, dibuat diam dulu agar ramah HP)
    platforms.push({ x: x, y: y, w: w, h: 15, type: "normal" });
  }

  // Menggambar Karakter (Pangeran & Putri)
  function drawCouple(x, y, facing, jumping) {
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(facing, 1); // Menghadap kiri/kanan

    // Efek lompat (kaki menekuk)
    const legOffset = jumping ? 10 : 0;
    
    // Bayangan
    ctx.fillStyle = "rgba(0,0,0,0.1)";
    ctx.beginPath();
    ctx.ellipse(0, 40, 20, 5, 0, 0, Math.PI * 2);
    ctx.fill();

    // Kaki Pangeran
    ctx.strokeStyle = COL.prince;
    ctx.lineWidth = 8;
    ctx.lineCap = "round";
    ctx.beginPath();
    ctx.moveTo(-5, 20); ctx.lineTo(-5, 35 - legOffset);
    ctx.moveTo(5, 20); ctx.lineTo(5, 35 - legOffset);
    ctx.stroke();

    // Badan Pangeran
    ctx.fillStyle = COL.prince;
    ctx.beginPath();
    ctx.moveTo(-15, 20); ctx.lineTo(-18, -25);
    ctx.quadraticCurveTo(0, -35, 18, -25);
    ctx.lineTo(15, 20);
    ctx.fill();

    // Lengan menggendong
    ctx.beginPath();
    ctx.moveTo(10, -10); ctx.quadraticCurveTo(30, -10, 35, 5);
    ctx.stroke();

    // Kepala Pangeran
    ctx.fillStyle = COL.skin;
    ctx.beginPath(); ctx.arc(0, -40, 12, 0, Math.PI * 2); ctx.fill();
    
    // Rambut Pangeran
    ctx.fillStyle = COL.hair;
    ctx.beginPath(); ctx.arc(0, -44, 12, Math.PI, 0); ctx.fill();

    // PUTRI (Digendong di punggung/depan)
    ctx.save();
    ctx.translate(20, -10);
    
    // Gaun Putri
    ctx.fillStyle = COL.dress;
    ctx.beginPath();
    ctx.moveTo(-5, 0); ctx.lineTo(15, 25);
    ctx.quadraticCurveTo(5, 30, -5, 25);
    ctx.fill();
    
    // Kepala Putri
    ctx.fillStyle = COL.skin;
    ctx.beginPath(); ctx.arc(0, -15, 10, 0, Math.PI * 2); ctx.fill();
    
    // Rambut & Mahkota
    ctx.fillStyle = COL.hair;
    ctx.beginPath(); ctx.arc(0, -18, 10, Math.PI, 0); ctx.fill();
    ctx.fillStyle = COL.gold;
    ctx.beginPath(); ctx.moveTo(-6, -25); ctx.lineTo(0, -30); ctx.lineTo(6, -25); ctx.fill();

    ctx.restore();
    ctx.restore();
  }

  // Update Logika Game
  function update() {
    if (gameOver) return;

    // Pergerakan Kiri / Kanan
    if (moveLeft) { player.vx = -MOVE_SPEED; player.facing = -1; }
    else if (moveRight) { player.vx = MOVE_SPEED; player.facing = 1; }
    else { player.vx = 0; }

    // Fisika Gravitasi
    player.vy += GRAVITY;
    player.x += player.vx;
    player.y += player.vy;

    // Bungkus layar (tembus kiri keluar kanan)
    if (player.x < -30) player.x = W + 30;
    if (player.x > W + 30) player.x = -30;

    // Kamera mengikuti pemain (Hanya naik, tidak turun)
    if (player.y < H / 2) {
      const diff = H / 2 - player.y;
      player.y = H / 2;
      cameraY += diff;
      platforms.forEach(p => p.y += diff);
      score = Math.max(score, Math.floor(cameraY / 50));
    }

    // Deteksi tabrakan platform (Hanya saat jatuh ke bawah)
    if (player.vy > 0) {
      for (let p of platforms) {
        // Tabrakan AABB kasar
        if (player.y + 20 >= p.y && player.y + 20 <= p.y + p.h + player.vy && 
            player.x > p.x - 15 && player.x < p.x + p.w + 15) {
          player.vy = JUMP_FORCE;
          player.isJumping = true;
          
          // Efek partikel saat melompat
          for(let i=0; i<5; i++) {
            particles.push({
              x: player.x, y: player.y + 20,
              vx: (Math.random() - 0.5) * 4, vy: Math.random() * -3,
              life: 1, color: Math.random() > 0.5 ? COL.gold : "#F4B8C9"
            });
          }
          break;
        }
      }
    } else {
      player.isJumping = false;
    }

    // Hapus platform yang sudah di bawah layar & buat platform baru di atas
    platforms = platforms.filter(p => p.y < H + 50);
    const highestPlatform = platforms[platforms.length - 1];
    if (highestPlatform && highestPlatform.y > 0) {
      createPlatform(highestPlatform.y - (Math.random() * 60 + 80));
    }

    // Partikel
    particles.forEach((pt, i) => {
      pt.x += pt.vx; pt.y += pt.vy; pt.vy += 0.1; pt.life -= 0.02;
      if (pt.life <= 0) particles.splice(i, 1);
    });

    // Game Over jika jatuh ke bawah
    if (player.y - cameraY > H + 100) {
      gameOver = true;
      if (score > highScore) {
        highScore = score;
        localStorage.setItem("jumpHi", highScore);
      }
    }
  }

  // Gambar Semua
  function draw() {
    // Background Gradient
    const bgGrad = ctx.createLinearGradient(0, 0, 0, H);
    bgGrad.addColorStop(0, "#F7EFDF");
    bgGrad.addColorStop(1, "#F1E5CE");
    ctx.fillStyle = bgGrad;
    ctx.fillRect(0, 0, W, H);

    // Bintang / Awan di background
    ctx.fillStyle = "rgba(255,255,255,0.6)";
    for(let i=0; i<5; i++) {
      let cy = (i * 200 - cameraY * 0.2) % H;
      if(cy < 0) cy += H;
      ctx.beginPath(); ctx.arc(W*0.2 + i*50, cy, 30, 0, Math.PI*2); ctx.fill();
    }

    // Gambar Platform
    platforms.forEach(p => {
      // Efek kertas lipat untuk platform
      ctx.fillStyle = p.type === "ground" ? "#8A9A7B" : "#FFFFFF";
      ctx.shadowColor = "rgba(0,0,0,0.1)";
      ctx.shadowBlur = 10;
      ctx.shadowOffsetY = 5;
      
      // Bentuk platform melengkung sedikit
      ctx.beginPath();
      ctx.roundRect(p.x, p.y, p.w, p.h, 8);
      ctx.fill();
      
      // Garis emas tipis di atas platform
      ctx.shadowColor = "transparent";
      ctx.strokeStyle = COL.gold;
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(p.x + 5, p.y + 2);
      ctx.lineTo(p.x + p.w - 5, p.y + 2);
      ctx.stroke();
    });

    // Gambar Partikel
    particles.forEach(pt => {
      ctx.globalAlpha = pt.life;
      ctx.fillStyle = pt.color;
      ctx.beginPath(); ctx.arc(pt.x, pt.y, 3, 0, Math.PI*2); ctx.fill();
    });
    ctx.globalAlpha = 1;

    // Gambar Karakter
    if (!gameOver) {
      drawCouple(player.x, player.y, player.facing, player.isJumping);
    }

    // UI Skor
    ctx.fillStyle = "#8A6A2E";
    ctx.font = "bold 20px 'Montserrat', sans-serif";
    ctx.textAlign = "left";
    ctx.fillText("Skor: " + score, 20, 40);
    ctx.fillStyle = "#9E7A3E";
    ctx.font = "14px 'Montserrat', sans-serif";
    ctx.fillText("Tertinggi: " + highScore, 20, 65);

    // Game Over Screen
    if (gameOver) {
      ctx.fillStyle = "rgba(255,255,255,0.85)";
      ctx.fillRect(0, H/2 - 80, W, 160);
      
      ctx.fillStyle = "#8A6A2E";
      ctx.font = "bold 28px 'Cormorant Garamond', serif";
      ctx.textAlign = "center";
      ctx.fillText("Jatuh Cinta Terlalu Dalam!", W/2, H/2 - 20);
      
      ctx.font = "14px 'Montserrat', sans-serif";
      ctx.fillStyle = "#555";
      ctx.fillText("Skor Akhir: " + score, W/2, H/2 + 15);
      ctx.fillText("Ketuk layar untuk coba lagi", W/2, H/2 + 45);
    }
  }

  // Polyfill untuk roundRect di browser lama
  if(!CanvasRenderingContext2D.prototype.roundRect) {
    CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
      if (w < 2 * r) r = w / 2;
      if (h < 2 * r) r = h / 2;
      this.beginPath();
      this.moveTo(x + r, y);
      this.arcTo(x + w, y, x + w, y + h, r);
      this.arcTo(x + w, y + h, x, y + h, r);
      this.arcTo(x, y + h, x, y, r);
      this.arcTo(x, y, x + w, y, r);
      this.closePath();
      return this;
    };
  }

  // Game Loop
  function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
  }

  // Restart Game saat Game Over
  canvas.addEventListener("touchstart", () => {
    if (gameOver) initGame();
  });
  window.addEventListener("keydown", (e) => {
    if (gameOver && (e.key === " " || e.key === "Enter")) initGame();
  });

  // Mulai
  initGame();
  loop();
</script>
</body>
</html>
